name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs only read the repository; nothing here needs a token that can write.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scan covers the whole history
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner
      - name: Static analysis (semgrep)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan
          --config p/python --config p/fastapi --config p/typescript --config p/react
          --config p/nextjs --config p/dockerfile --config p/secrets
          --exclude node_modules --exclude .next --exclude .venv --metrics=off --error
      - uses: astral-sh/setup-uv@v6
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: Node dependencies (npm audit)
        working-directory: frontend
        # Only build-time tooling (shadcn → deepmerge) carries low-severity advisories today.
        run: npm audit --omit=dev --audit-level=moderate

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voryn
          POSTGRES_PASSWORD: voryn
          POSTGRES_DB: voryn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voryn" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://voryn:voryn@localhost:5432/voryn
      TEST_DATABASE_URL: postgresql+asyncpg://voryn:voryn@localhost:5432/voryn_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Migrations apply and match models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t voryn-api ./backend
          docker build -t voryn-web --target runtime ./frontend
