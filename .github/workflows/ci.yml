name: CI

# Lint, types, migrations, tests and build. Called by security.yml (stages 5 and 6), so a
# pull request runs it once, as part of the security pipeline; also runnable by hand.
on:
  workflow_call:
  workflow_dispatch:

# Jobs only read the repository; nothing here needs a token that can write.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voryn
          POSTGRES_PASSWORD: voryn # throwaway CI database, never reachable from outside
          POSTGRES_DB: voryn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voryn" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://voryn:voryn@localhost:5432/voryn
      TEST_DATABASE_URL: postgresql+asyncpg://voryn:voryn@localhost:5432/voryn_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
          enable-cache: true # keyed by uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Migrations apply, roll back and match models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check
      - name: Authorization, isolation and security regression tests
        run: >-
          uv run pytest -q tests/test_authorization.py tests/test_security_controls.py
          tests/test_signal_quality.py tests/test_security_primitives.py
      - name: All tests (unit, integration, financial)
        run: uv run pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm # keyed by package-lock.json
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
