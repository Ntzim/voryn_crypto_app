[project]
name = "voryn-api"
version = "0.1.0"
description = "Voryn — Crypto Intelligence Platform API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "redis>=6.4,<6.5",
    "celery[redis]>=5.6,<6",
    "httpx>=0.28,<1",
    "argon2-cffi>=25.1",
    "pyotp>=2.10,<3",
    "cryptography>=50",
    "structlog>=26.1",
    "sentry-sdk[fastapi]>=2.73,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "fakeredis>=2.40",
    "ruff>=0.17",
    "mypy>=2.4",
    "celery-types>=0.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "N"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "N817"]
"app/modules/audit/service.py" = ["S105"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pyotp.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
